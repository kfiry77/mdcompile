name: "PlantUML Processing Action"
description: "A GitHub Action to process .src.md files and convert them to .md files with embedded PlantUML diagrams."
author: "Kfir Yehezkel"
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  output_dir:
    description: "The output directory where the .md files will be saved."
    required: true
    default: "mdcompile"
runs:
  using: "composite"
  steps:
    - name: Set up Python virtual environment
      shell: bash
      run: |
        python3 -m venv venv
        source venv/bin/activate
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run PlantUML Processing Script
      shell: bash
      run: |
        source venv/bin/activate
        python scripts/process_codemd.py --output_dir "${{ inputs.output_dir }}"

